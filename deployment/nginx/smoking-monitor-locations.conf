# 烟厂制丝线物流智能监控平台 —— Nginx location 片段（路径式接入，走已放通的 80 端口）
#
# ── 为什么需要这个文件 ─────────────────────────────────────────────────
#   目标服务器 110.42.236.65 的云安全组**只放通了 22 / 80 / 443**，
#   18081、18082 等端口从外部一律超时不可达（已实测确认：
#   在服务器上访问自身公网 IP 的 18082 也是超时，仅 80/443 可达）。
#
#   因此对外入口只能复用 80 端口。为了**完全不新建 server_name、不抢占
#   已有 server 块**，这里采用与服务器上既有做法（/market/、/home/）
#   一致的"路径前缀"方式：以 /smoking/ 作为本平台的独立入口。
#
#   注意：本文件**不被 smoking-monitor.conf 使用**。它是给承载 80 端口的
#   已有 server 块（sites-enabled/fitness，server_name 110.42.236.65）
#   通过 include 引入的，因为同一端口上无法再用第二个 server_name 命中。
#
# ── 安装（追加一行 include，不改动该 server 块的其他任何指令）──────────
#   sudo cp deployment/nginx/smoking-monitor-locations.conf /etc/nginx/snippets/
#   sudo sed -i '/server_name 110.42.236.65;/a\    include /etc/nginx/snippets/smoking-monitor-locations.conf;' \
#        /etc/nginx/sites-available/fitness
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── 访问 ──────────────────────────────────────────────────────────────
#   http://110.42.236.65/smoking/
#
# ── 回滚 ──────────────────────────────────────────────────────────────
#   删除 fitness 中那一行 include 并 reload 即可，不留任何痕迹。

# ---- 无斜杠时补斜杠：保证相对资源路径正确解析 ----
location = /smoking {
    return 301 /smoking/;
}

# ---- API 反代到本机 FastAPI（后端只监听 127.0.0.1:18081）----
location /smoking/api/ {
    proxy_pass         http://127.0.0.1:18081/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

# ---- 带 hash 的构建产物：长缓存 ----
location /smoking/assets/ {
    alias /var/www/smoking-monitor/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---- 监控视频：支持 Range 请求，便于循环播放与拖动 ----
# 大视频单独上传到此目录（不入 Git）；缺失时前端自动回退静态监控图
location /smoking/videos/ {
    alias /var/www/smoking-monitor/dist/videos/;
    add_header Accept-Ranges bytes;
    expires 7d;
    try_files $uri =404;
}

# ---- 静态监控图 ----
location /smoking/images/ {
    alias /var/www/smoking-monitor/dist/images/;
    expires 7d;
    try_files $uri =404;
}

# ---- 单页应用：未命中的路径回退到 index.html ----
location /smoking/ {
    alias /var/www/smoking-monitor/dist/;
    index index.html;
    try_files $uri $uri/ /smoking/index.html;
}
