# 烟厂制丝线物流智能监控平台 —— Nginx 站点配置
#
# ── 部署前勘查结论（目标服务器 110.42.236.65 / VM-0-11-ubuntu）─────────────
#   已占用端口：22, 53, 80, 443, 8000, 18080
#   已有站点  ：ccqspace.site (80/443, Certbot) 与 110.42.236.65:80 (fitness)
#   因此本平台使用**独立端口 18082**，不新增 server_name，不改动任何已有配置。
#   （80 端口已被 fitness 站点以 server_name 110.42.236.65 占用，
#     若在此再监听 80 会产生 server_name 冲突，故不使用 80。）
#
# ── 安装（新增独立文件，不覆盖已有 conf）────────────────────────────────
#   sudo cp deployment/nginx/smoking-monitor.conf /etc/nginx/conf.d/smoking-monitor.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── 访问 ────────────────────────────────────────────────────────────────
#   http://110.42.236.65:18082/

server {
    listen       18082;
    listen       [::]:18082;
    server_name  _;

    # ---- 站点根目录：前端构建产物 frontend/dist ----
    root  /var/www/smoking-monitor/dist;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/smoking-monitor.access.log;
    client_max_body_size 8m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- gzip（与服务器上已有站点保持一致的策略）----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    # 不要重复声明 application/javascript：新版 mime.types 已把它并入 text/javascript，
    # 重复会让 nginx -t 报 duplicate MIME type 警告
    gzip_types text/plain text/css application/json image/svg+xml
               text/javascript application/wasm;

    # ---- 带 hash 的构建产物：长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 监控视频：支持 Range 请求，便于拖动与循环播放 ----
    # 大视频单独上传到此目录（不入 Git），缺失时前端自动回退静态监控图
    #
    # 缓存策略：**短缓存**，不能用 expires 7d。
    # 这类资源在部署时会被直接覆盖（文件名不变），若下发 max-age=604800，
    # 浏览器会在一周内一直播放旧文件 —— 曾因此出现"服务器已是新视频、
    # 页面上仍是带水印旧视频"的问题。5 分钟足够减少重复请求，
    # 又能保证换素材后无需用户清缓存。
    #
    # 不必显式声明 Accept-Ranges：nginx 对静态文件默认就会下发
    # "Accept-Ranges: bytes"（Range 请求因此天然可用），
    # 再 add_header 一次会产生重复响应头。
    location /videos/ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ---- 静态监控图与证据图：同样使用短缓存（理由同上，证据图也会被覆盖）----
    location /images/ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ---- API 反向代理到本机 FastAPI ----
    # 后端只监听 127.0.0.1:18081，不直接对外暴露
    location /api/ {
        proxy_pass         http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---- 单页应用：未命中的路径回退到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
