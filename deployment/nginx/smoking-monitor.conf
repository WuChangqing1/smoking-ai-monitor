# 烟厂制丝线物流智能监控平台 —— Nginx 站点配置
#
# 部署前必读：
#   1. 先用 `ss -lntp` 与 `nginx -T` 勘查服务器上已占用的端口与已有站点；
#   2. 本文件使用**独立端口 18081 + 独立 root 目录**，不修改任何已有 server 块；
#   3. 若 18081 已被占用，改成其它空闲高位端口即可（同时同步 README 中的访问地址）；
#   4. 安装：sudo cp deployment/nginx/smoking-monitor.conf /etc/nginx/conf.d/
#            sudo nginx -t && sudo systemctl reload nginx

server {
    listen       18081;
    listen       [::]:18081;
    server_name  _;

    # ---- 站点根目录：前端构建产物 frontend/dist ----
    # 部署时替换成实际路径（例如 /var/www/smoking-monitor/dist 或 /home/<user>/apps/smoking-monitor/dist）
    root  /var/www/smoking-monitor/dist;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/smoking-monitor.access.log;
    client_max_body_size 8m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 静态资源：带 hash 的构建产物长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 监控视频：支持 Range 请求，便于拖动与循环播放 ----
    location /videos/ {
        add_header Accept-Ranges bytes;
        expires 7d;
        try_files $uri =404;
    }

    # ---- API 反向代理到本机 FastAPI ----
    # 后端只监听 127.0.0.1，不直接对外暴露
    location /api/ {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---- 单页应用：未命中的路径回退到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
